[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "win-threat-hunter"
version = "0.1.0"
description = "Hunt for attacker behaviour in Windows Security / Sysmon / PowerShell event logs with YAML rules mapped to MITRE ATT&CK."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-evtx>=0.8",
    "rich>=13.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wth = "wth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
