id: WTH-003
title: Password spraying - one source failing against many accounts
description: >
  Failed logons (4625) for six or more DIFFERENT user names from one source IP
  within 10 minutes. Spraying tries one common password against many accounts
  to stay under per-account lockout thresholds, so counting distinct users
  catches what a plain failure count can miss.
severity: high
mitre:
  technique_id: T1110.003
  technique_name: "Brute Force: Password Spraying"
  tactic: Credential Access
detection:
  event_ids: [4625]
  conditions:
    - field: IpAddress
      op: equals
      value: ["-", ""]
      negate: true
threshold:
  count: 6
  window_seconds: 600
  group_by: [IpAddress]
  distinct: TargetUserName
response: >
  Block the source IP, list every targeted account and check for any
  successful logon from the same source. Force password resets for targeted
  accounts that use weak or seasonal passwords; enforce MFA.
false_positives:
  - Shared jump host or terminal server where many users mistype passwords
references:
  - https://attack.mitre.org/techniques/T1110/003/
